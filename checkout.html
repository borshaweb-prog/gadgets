<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Gadgets</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="section"><a href="index.html">← Store</a><h1>Complete your order</h1><form id="form" class="card" style="max-width:700px"><input name="name" required placeholder="Full name"><input name="phone" required placeholder="Phone number"><input name="email" required type="email" placeholder="Email"><input name="address" required placeholder="Full home/shipping address"><select name="payment" required><option value="">Payment method</option><option>Cash on Delivery</option><option>Bank / Mobile Payment</option><option>Card</option></select><textarea name="note" placeholder="Order note"></textarea><button class="btn">Place order</button></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.items=JSON.parse(localStorage.getItem('gadgets-cart')||'[]');let r=await fetch('api/orders.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(j.success){localStorage.removeItem('gadgets-cart');alert('Order placed: '+j.order_id);location.href='index.html'}else alert(j.error||'Order failed')}</script></body></html>
