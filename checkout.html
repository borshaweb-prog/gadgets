<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Gadgets</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topline">Secure checkout · Genuine products · Fast delivery</div><header class="mainhead"><a class="logo" href="index.html">GADGETS<span>.</span><small>SMART TECHNOLOGY</small></a><a class="builder-btn" href="index.html">← Continue shopping</a></header><main class="account-page"><div class="account-card" style="max-width:720px"><small>ORDER CHECKOUT</small><h1>Complete your order</h1><p>Enter your delivery and payment information.</p><form id="form"><input name="name" required placeholder="Full name"><input name="phone" required placeholder="Phone number"><input name="email" required type="email" placeholder="Email address"><textarea name="address" required placeholder="Full home / shipping address"></textarea><select name="payment" required><option value="">Choose payment method</option><option>Cash on Delivery</option><option>bKash / Nagad</option><option>Bank Transfer</option><option>Card Payment</option></select><textarea name="note" placeholder="Order note (optional)"></textarea><button class="orange-btn full">Place Order</button></form><div id="status"></div></div></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.items=JSON.parse(localStorage.getItem('gadgets-cart')||'[]');if(!d.items.length)return alert('Your cart is empty.');const r=await fetch('api/orders.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(j.success){localStorage.removeItem('gadgets-cart');document.getElementById('status').textContent='Order placed successfully: '+j.order_id;setTimeout(()=>location.href='index.html',1800)}else document.getElementById('status').textContent=j.error||'Order failed';}</script></body></html>
