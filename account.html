<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Gadgets</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="mainhead"><a class="logo" href="index.html">GADGETS<span>.</span><small>SMART TECHNOLOGY</small></a><a class="builder-btn" href="index.html">← Store</a></header><main class="account-page"><div class="account-card"><div class="account-tabs"><button class="active" onclick="tab('login',this)">Login</button><button onclick="tab('register',this)">Register</button></div><form id="login"><h1>Welcome back</h1><p>Login to manage your account and orders.</p><input name="email" type="email" required placeholder="Email address"><input name="password" type="password" required placeholder="Password"><button class="orange-btn full">Login</button></form><form id="register" style="display:none"><h1>Create account</h1><p>Register for faster checkout and order tracking.</p><input name="name" required placeholder="Full name"><input name="phone" required placeholder="Phone number"><input name="email" type="email" required placeholder="Email address"><input name="password" type="password" minlength="6" required placeholder="Password"><button class="orange-btn full">Create account</button></form><div id="accountMsg"></div></div></main><script>function tab(x,b){document.querySelectorAll('.account-card form').forEach(f=>f.style.display='none');document.getElementById(x).style.display='block';document.querySelectorAll('.account-tabs button').forEach(v=>v.classList.remove('active'));b.classList.add('active')}async function send(id,action){const f=document.getElementById(id);f.onsubmit=async e=>{e.preventDefault();const r=await fetch('api/account.php?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json();document.getElementById('accountMsg').textContent=j.message||j.error||'Done';if(j.success&&action==='login')location.href='index.html'}}send('login','login');send('register','register');</script></body></html>
