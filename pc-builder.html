<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Builder | Gadgets</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.builder{background:#f2f4f8!important;padding:28px 15px 60px;color:#111!important}
.builder *{box-sizing:border-box}.builder-box{max-width:920px;margin:auto;background:#fff;border:1px solid #d8dce5;color:#111!important}
.builder-head{height:72px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 22px;background:#fff}.builder-head .logo{margin-right:auto;color:#111!important}
.builder-tools button{border:0;background:#fff;color:#111!important;padding:0 12px;font-size:10px;cursor:pointer}.builder-tools b{display:block;color:#f04d2a;font-size:18px}
.builder-title{padding:25px 60px 15px;display:flex;gap:15px;align-items:center;color:#111!important}.builder-title h1{font-size:14px;color:#2037bd!important;margin:0}
.builder-title label{font-size:11px;color:#444!important;white-space:nowrap}.builder-title .stats{margin-left:auto;display:flex}
.stat{padding:9px 18px;text-align:center;border:1px dashed #ff6747;color:#111!important;background:#fff}.stat:last-child{background:#3e50c9!important;color:#fff!important;border:0}
.stat b,.stat small{display:block}.stat b{font-size:16px}.stat small{font-size:9px}.bar{margin:8px 60px 0;background:#89929d;color:#fff!important;padding:4px 9px;font-size:11px;font-weight:bold}
.part{margin:0 60px;min-height:78px;border-bottom:1px solid #e6e8ec;display:grid;grid-template-columns:45px 1fr 95px 80px;gap:14px;align-items:center;color:#111!important}
.part-icon{width:40px;height:40px;background:#f0f3ff;color:#304bd3!important;display:grid;place-items:center;font-size:21px}.part-name{font-size:12px;color:#111!important;font-weight:700}
.req{background:#666;color:#fff!important;font-size:8px;padding:2px 4px;margin-left:5px}.selected{display:block;color:#667085!important;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.part-price{text-align:right;font-size:12px;font-weight:bold;color:#111!important}.choose{border:1px solid #283dd0;background:#fff;color:#2034bd!important;padding:10px 8px;border-radius:3px;font-weight:bold;cursor:pointer}.choose:hover{background:#f0f3ff}
.builder-summary{margin:20px 60px;padding:15px;background:#f8f9fb;border:1px solid #e1e4eb;display:flex;align-items:center;gap:20px;color:#111!important}.builder-summary small{color:#555!important}
.total{font-size:22px;font-weight:900;color:#111!important}#message{color:#555!important;font-size:11px}.addbuild{margin-left:auto;background:#283bc9;color:#fff!important;border:0;padding:12px 18px;font-weight:bold;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal.open{display:flex}
.modalbox{background:#fff;width:min(760px,100%);max-height:85vh;overflow:auto;color:#111!important;border-radius:4px}.modalhead{padding:16px;border-bottom:1px solid #eee;display:flex;align-items:center;color:#111!important}
#modalTitle{font-size:15px;color:#111!important}.close{margin-left:auto;border:0;background:none;color:#111!important;font-size:24px;cursor:pointer}
.options{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #ddd;background:#fff;color:#111!important;padding:12px;text-align:left;border-radius:4px;cursor:pointer}
.option:hover{border-color:#293dd1;background:#f8f9ff}.option b{display:block;color:#111!important;font-size:12px}.option strong{display:block;color:#e94322!important;margin-top:5px;font-size:13px}
.option small{display:block;color:#667085!important;margin-top:4px;font-size:10px}.option .meta{display:block;color:#444!important;margin-top:3px;font-size:9px}
@media(max-width:700px){.builder-title,.part,.builder-summary{margin-left:18px;margin-right:18px}.builder-title{padding:18px;flex-wrap:wrap}.builder-title .stats{margin-left:0}.part{grid-template-columns:38px 1fr 70px 60px;gap:7px}.options{grid-template-columns:1fr}.builder-summary{flex-wrap:wrap}.addbuild{margin-left:0}.builder-tools button{padding:0 5px}}
</style>
</head>
<body>
<div class="topline">Fast delivery across Bangladesh · Genuine products · Expert support</div>
<header class="mainhead"><a class="logo" href="index.html">GADGETS<span>.</span><small>SMART TECHNOLOGY</small></a><div class="searchbox"><input placeholder="Build your custom PC"></div><a class="builder-btn" href="index.html">Store</a></header>
<div class="builder"><div class="builder-box">
<div class="builder-head"><a class="logo" href="index.html">GADGETS<span>.</span></a><div class="builder-tools">
<button onclick="addBuild()"><b>🛒</b>Add to Cart</button><button onclick="savePC()"><b>▣</b>Save PC</button><button onclick="window.print()"><b>🖨</b>Print</button>
</div></div>
<div class="builder-title"><h1>PC Builder - Build Your Own Computer - Gadgets</h1><label><input id="hide" type="checkbox"> Hide Unconfigured Components</label>
<div class="stats"><div class="stat"><b id="wat">0W</b><small>Estimated Wattage</small></div><div class="stat"><b id="count">0</b><small>Items</small></div></div></div>
<div class="bar">Core Components</div><div id="parts"></div>
<div class="builder-summary"><div><small>ESTIMATED TOTAL</small><div class="total">৳<span id="total">0</span></div></div><span id="message">Select components for your build.</span><button class="addbuild" onclick="addBuild()">Add Build to Cart</button></div>
</div></div>
<div id="modal" class="modal" aria-hidden="true"><div class="modalbox"><div class="modalhead"><b id="modalTitle"></b><button class="close" onclick="closeModal()" aria-label="Close">×</button></div><div id="options" class="options"></div></div></div>
<script>
const parts={
CPU:[['AMD Ryzen 5 5600',13500,65],['AMD Ryzen 5 7600',23500,65],['AMD Ryzen 7 7700',31500,65],['AMD Ryzen 7 7800X3D',52000,120],['AMD Ryzen 9 7900X',57500,170],['AMD Ryzen 9 7950X',72000,170],['Intel Core i5-12400F',14500,65],['Intel Core i5-14400F',25500,65],['Intel Core i7-14700K',46500,125],['Intel Core i9-14900K',63500,253]],
'CPU Cooler':[['DeepCool AG400',2200,6],['DeepCool AK400',3200,8],['Cooler Master Hyper 212',3900,10],['DeepCool AK620',7200,12],['Thermalright Peerless Assassin 120',6500,12],['Cooler Master ML240L',7200,14],['NZXT Kraken 240',14500,15],['DeepCool LS520 SE',9500,15],['Arctic Liquid Freezer III 240',12500,15],['be quiet! Pure Rock 2',6200,10]],
Motherboard:[['MSI B550M PRO-VDH WIFI',14500,55],['Gigabyte B650M DS3H',16500,55],['ASRock B650M-HDV/M.2',17500,55],['MSI B650 Gaming Plus WIFI',22000,60],['Gigabyte B650 AORUS Elite AX',28500,65],['ASUS TUF Gaming B650-PLUS WIFI',29500,65],['MSI MAG Z790 Tomahawk WIFI',38500,70],['Gigabyte Z790 AORUS Elite AX',36500,70],['ASUS ROG Strix B650E-F Gaming WIFI',41000,70],['ASRock Z790 Steel Legend WIFI',39500,70]],
RAM:[['Corsair Vengeance 16GB DDR4',4800,5],['Corsair Vengeance 16GB DDR5',6500,5],['Kingston Fury Beast 16GB DDR5',6200,5],['Corsair Vengeance 32GB DDR5',12500,6],['Kingston Fury Beast 32GB DDR5',13200,6],['G.Skill Ripjaws S5 32GB DDR5',13800,6],['Corsair Vengeance 64GB DDR5',24500,8],['G.Skill Trident Z5 64GB DDR5',28500,8],['TeamGroup T-Force Delta RGB 32GB DDR5',14500,6],['Kingston Fury Renegade 32GB DDR5',15200,6]],
Storage:[['WD Blue SN580 1TB NVMe',7500,5],['WD Black SN770 1TB NVMe',8500,5],['Samsung 990 EVO 1TB',10500,6],['Samsung 990 PRO 1TB',12500,6],['Kingston KC3000 2TB',16500,7],['WD Black SN850X 2TB',20500,7],['Samsung 990 PRO 2TB',20500,7],['Seagate Barracuda 2TB HDD',7200,6],['Seagate IronWolf 4TB HDD',14500,8],['Crucial P3 Plus 2TB NVMe',14500,6]],
'Graphics Card':[['ASUS Dual RTX 4060 8GB',38000,115],['MSI RTX 4060 Ti 8GB',48500,160],['Gigabyte RTX 4070 12GB',78000,200],['ASUS TUF RTX 4070 SUPER 12GB',85000,220],['MSI RTX 4070 Ti SUPER 16GB',108000,285],['Gigabyte RTX 4080 SUPER 16GB',145000,320],['ASUS TUF RTX 4090 24GB',235000,450],['Sapphire RX 7600 8GB',41000,165],['Sapphire RX 7800 XT 16GB',72000,250],['Sapphire RX 7900 XTX 24GB',125000,355]],
'Power Supply':[['Cooler Master MWE 550 Bronze',5200,0],['Corsair CX650 650W Bronze',6500,0],['Cooler Master MWE 650 Gold',8500,0],['Corsair RM750e 750W Gold',10500,0],['Seasonic Focus GX-750',11500,0],['Corsair RM850x 850W Gold',14500,0],['Seasonic Vertex GX-1000',24500,0],['Corsair RM1200x 1200W Gold',28500,0],['Cooler Master MWE Gold 850 V2',12500,0],['be quiet! Pure Power 12 M 850W',14500,0]],
Case:[['Value-Top VT-MX10 Airflow',4500,0],['Antec NX410',5800,0],['DeepCool CC560',6200,0],['Airflow Mid Tower',6500,0],['NZXT H5 Flow',10500,0],['Lian Li LANCOOL 216',14500,0],['Corsair 4000D Airflow',12500,0],['Fractal Design North',18500,0],['Montech AIR 903 MAX',8500,0],['Cooler Master TD500 Mesh V2',11500,0]],
Monitor:[['AOC 24G2SP 24" 1080p',18000,30],['LG UltraGear 24GN60R 24"',19500,30],['Dell G2724D 27" 1440p',36000,35],['LG UltraGear 27GR75Q 27"',39000,35],['ASUS TUF VG27AQ 27"',42000,40],['Gigabyte M27Q 27"',45000,40],['Samsung Odyssey G5 32"',52000,45],['LG UltraGear 32GS95UE OLED',125000,60],['MSI G274QPF-QD 27"',48000,40],['AOC CQ32G2S 32" Curved',42000,45]],
Keyboard:[['A4Tech KR-85 USB Keyboard',1200,2],['Logitech K120',1500,2],['Redragon K552 Kumara',4200,3],['Keychron K8 Pro',6550,3],['Logitech MX Keys S',10500,3],['Razer BlackWidow V4',14500,4],['Logitech G Pro X TKL',17500,4],['Corsair K70 RGB PRO',19500,4],['Royal Kludge RK84',5200,3],['Akko 5075B Plus',8500,3]],
Mouse:[['A4Tech OP-720',700,1],['Logitech B100',850,1],['Logitech G102 Lightsync',2200,2],['Razer DeathAdder Essential',2800,2],['Logitech MX Master 3S',9500,2],['Razer DeathAdder V3',11200,2],['Logitech G Pro X Superlight 2',14500,2],['Razer Basilisk V3 Pro',16500,3],['Logitech G502 X',12500,2],['SteelSeries Rival 5',6500,2]]
};
const required=['CPU','Motherboard','RAM','Storage','Graphics Card','Power Supply'];
const icons={CPU:'▣','CPU Cooler':'◉',Motherboard:'▦',RAM:'▥',Storage:'▰','Graphics Card':'▰','Power Supply':'⚡',Case:'▤',Monitor:'▤',Keyboard:'⌨',Mouse:'⌁'};
let build={};
function esc(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
 const hide=document.getElementById('hide').checked;
 document.getElementById('parts').innerHTML=Object.keys(parts).map(function(t){
  if(hide&&!build[t])return '';
  const v=build[t];
  return '<div class="part"><div class="part-icon">'+(icons[t]||'✦')+'</div><div class="part-name">'+esc(t)+(required.includes(t)?'<span class="req">Required</span>':'')+'<span class="selected">'+(v?esc(v[0]):'Not selected')+'</span></div><div class="part-price">'+(v?'৳'+v[1].toLocaleString():'—')+'</div><button class="choose" onclick="openOptions('+JSON.stringify(t)+')">Choose</button></div>';
 }).join('');
 update();
}
function openOptions(t){
 if(!parts[t]||!parts[t].length){alert('No products available for '+t);return} document.getElementById('modalTitle').textContent='Choose '+t+' · '+parts[t].length+' products';
 document.getElementById('options').innerHTML=parts[t].map(function(x,i){
  return '<button type="button" class="option" onclick="pick('+JSON.stringify(t)+','+i+')"><b>'+esc(x[0])+'</b><strong>৳'+x[1].toLocaleString()+'</strong><small>Estimated power: '+x[2]+'W</small><span class="meta">Genuine product · Warranty support</span></button>';
 }).join('');
 document.getElementById('modal').classList.add('open');
 document.getElementById('modal').setAttribute('aria-hidden','false');
}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modal').setAttribute('aria-hidden','true')}
function pick(t,i){build[t]=parts[t][i];closeModal();render()}
function update(){
 const a=Object.values(build),total=a.reduce(function(s,x){return s+x[1]},0),wat=a.reduce(function(s,x){return s+x[2]},0),missing=required.filter(function(x){return !build[x]});
 document.getElementById('total').textContent=total.toLocaleString();document.getElementById('wat').textContent=wat+'W';document.getElementById('count').textContent=a.length;
 document.getElementById('message').textContent=missing.length?'Missing required: '+missing.join(', '):'✓ Required components selected.';
}
function addBuild(){
 const missing=required.filter(function(x){return !build[x]});
 if(missing.length){alert('Please select: '+missing.join(', '));return}
 const total=Object.values(build).reduce(function(s,x){return s+x[1]},0),cart=JSON.parse(localStorage.getItem('gadgets-cart')||'[]');
 cart.push({id:'build-'+Date.now(),name:'Custom PC Build',category:'Desktop',price:total,details:Object.keys(build).map(function(k){return k+': '+build[k][0]}).join(' · '),qty:1});
 localStorage.setItem('gadgets-cart',JSON.stringify(cart));location.href='checkout.html';
}
function savePC(){localStorage.setItem('gadgets-saved-pc',JSON.stringify(build));alert('PC build saved on this device.')}
document.getElementById('hide').onchange=render;
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
