<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Builder | Gadgets</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="mainhead"><a class="logo" href="index.html">GADGETS<span>.</span><small>SMART TECHNOLOGY</small></a><div class="searchbox"><input placeholder="Build your custom PC"></div><a class="builder-btn" href="index.html">Store</a></header><main class="builder-page"><div class="builder-hero"><small>GADGETS PC BUILDER</small><h1>Build a PC that<br><strong>fits your budget.</strong></h1><p>Select components and see the estimated total instantly.</p></div><div class="builder-grid"><section class="builder-list" id="parts"></section><aside class="build-summary"><small>YOUR BUILD</small><h2>৳<span id="buildTotal">0</span></h2><div id="selected"></div><button class="orange-btn full" onclick="addBuildToCart()">Add build to cart</button></aside></div></main><script>const parts={CPU:[['Ryzen 5 7600',23500],['Core i5-14400F',25500],['Ryzen 7 7800X3D',52000]],GPU:[['RTX 4060 8GB',38000],['RTX 4070 SUPER',85000],['RX 7800 XT',72000]],RAM:[['16GB DDR5',6500],['32GB DDR5',12500],['64GB DDR5',24000]],Storage:[['1TB NVMe SSD',8500],['2TB NVMe SSD',15000]],PSU:[['650W 80+ Bronze',6500],['750W 80+ Gold',11000]],Case:[['Airflow Mid Tower',6500],['Premium Gaming Case',12000]]};let build={};function render(){document.getElementById('parts').innerHTML=Object.entries(parts).map(([type,items])=>'<div class="part"><h3>'+type+'</h3>'+items.map((x,i)=>'<button onclick="choose(\''+type+'\','+i+')"><b>'+x[0]+'</b><span>৳'+x[1].toLocaleString()+'</span></button>').join('')+'</div>').join('')}function choose(t,i){build[t]=parts[t][i];update()}function update(){document.getElementById('selected').innerHTML=Object.entries(build).map(([k,v])=>'<p><b>'+k+'</b> '+v[0]+'<span>৳'+v[1].toLocaleString()+'</span></p>').join('')||'<p class="muted">Choose your components.</p>';document.getElementById('buildTotal').textContent=Object.values(build).reduce((s,x)=>s+x[1],0).toLocaleString()}function addBuildToCart(){const total=Object.values(build).reduce((s,x)=>s+x[1],0);if(!total)return alert('Select components first');const cart=JSON.parse(localStorage.getItem('gadgets-cart')||'[]');cart.push({id:'build-'+Date.now(),name:'Custom PC Build',category:'Desktop',price:total,details:Object.values(build).map(x=>x[0]).join(' · '),qty:1});localStorage.setItem('gadgets-cart',JSON.stringify(cart));location.href='checkout.html'}render();update()</script></body></html>
