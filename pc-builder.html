<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Builder | Gadgets</title><link rel="stylesheet" href="assets/style.css"><style>
.builder{background:#f2f4f8;padding:28px 15px 60px}.builder-box{max-width:920px;margin:auto;background:#fff;border:1px solid #d8dce5}.builder-head{height:72px;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 22px}.builder-head .logo{margin-right:auto}.builder-tools button{border:0;background:#fff;padding:0 12px;font-size:10px}.builder-tools b{display:block;color:#f04d2a;font-size:18px}.builder-title{padding:25px 60px 15px;display:flex;gap:15px;align-items:center}.builder-title h1{font-size:14px;color:#2037bd}.builder-title .stats{margin-left:auto;display:flex}.stat{padding:9px 18px;text-align:center;border:1px dashed #ff6747}.stat:last-child{background:#3e50c9;color:#fff;border:0}.stat b,.stat small{display:block}.stat b{font-size:16px}.stat small{font-size:9px}.bar{margin:8px 60px 0;background:#89929d;color:#fff;padding:4px 9px;font-size:11px;font-weight:bold}.part{margin:0 60px;min-height:78px;border-bottom:1px solid #e6e8ec;display:grid;grid-template-columns:45px 1fr 95px 80px;gap:14px;align-items:center}.part-icon{width:40px;height:40px;background:#f0f3ff;color:#304bd3;display:grid;place-items:center;font-size:21px}.part-name{font-size:12px}.req{background:#666;color:#fff;font-size:8px;padding:2px 4px;margin-left:5px}.selected{display:block;color:#667085;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.part-price{text-align:right;font-size:12px;font-weight:bold}.choose{border:1px solid #283dd0;background:#fff;color:#2034bd;padding:10px 8px;border-radius:3px;font-weight:bold;cursor:pointer}.builder-summary{margin:20px 60px;padding:15px;background:#f8f9fb;border:1px solid #e1e4eb;display:flex;align-items:center;gap:20px}.total{font-size:22px;font-weight:900}.addbuild{margin-left:auto;background:#283bc9;color:#fff;border:0;padding:12px 18px;font-weight:bold}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{background:#fff;width:min(700px,100%);max-height:85vh;overflow:auto}.modalhead{padding:16px;border-bottom:1px solid #eee;display:flex}.close{margin-left:auto;border:0;background:none;font-size:24px}.options{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid #ddd;background:#fff;padding:12px;text-align:left;border-radius:4px;cursor:pointer}.option:hover{border-color:#293dd1}.option strong{display:block;color:#e94322;margin-top:5px}.option small{display:block;color:#667085;margin-top:4px}@media(max-width:700px){.builder-title,.part,.builder-summary{margin-left:18px;margin-right:18px}.builder-title{padding:18px;flex-wrap:wrap}.builder-title .stats{margin-left:0}.part{grid-template-columns:38px 1fr 60px 60px;gap:7px}.options{grid-template-columns:1fr}.builder-summary{flex-wrap:wrap}.addbuild{margin-left:0}}
</style></head><body><div class="topline">Fast delivery across Bangladesh · Genuine products · Expert support</div><header class="mainhead"><a class="logo" href="index.html">GADGETS<span>.</span><small>SMART TECHNOLOGY</small></a><div class="searchbox"><input placeholder="Build your custom PC"></div><a class="builder-btn" href="index.html">Store</a></header><div class="builder"><div class="builder-box"><div class="builder-head"><a class="logo" href="index.html">GADGETS<span>.</span></a><div class="builder-tools"><button onclick="addBuild()"><b>🛒</b>Add to Cart</button><button onclick="savePC()"><b>▣</b>Save PC</button><button onclick="print()"><b>🖨</b>Print</button></div></div><div class="builder-title"><h1>PC Builder - Build Your Own Computer - Gadgets</h1><label><input id="hide" type="checkbox"> Hide Unconfigured Components</label><div class="stats"><div class="stat"><b id="wat">0W</b><small>Estimated Wattage</small></div><div class="stat"><b id="count">0</b><small>Items</small></div></div></div><div class="bar">Core Components</div><div id="parts"></div><div class="builder-summary"><div><small>ESTIMATED TOTAL</small><div class="total">৳<span id="total">0</span></div></div><span id="message">Select components for your build.</span><button class="addbuild" onclick="addBuild()">Add Build to Cart</button></div></div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><b id="modalTitle"></b><button class="close" onclick="closeModal()">×</button></div><div id="options" class="options"></div></div></div><script>
const parts={CPU:[['Ryzen 5 7600',23500,65],['Core i5-14400F',25500,65],['Ryzen 7 7800X3D',52000,120]],'CPU Cooler':[['DeepCool AK400',3200,8],['DeepCool AK620',7200,12],['NZXT Kraken 240',14500,15]],Motherboard:[['B650M DS3H',16500,55],['MSI B650 Gaming Plus',22000,60],['Z790 AORUS Elite',36500,70]],RAM:[['Vengeance 16GB DDR5',6500,5],['Vengeance 32GB DDR5',12500,6],['Fury Beast 32GB DDR5',13200,6]],Storage:[['WD SN770 1TB',8500,5],['Samsung 990 PRO 1TB',12500,6],['Samsung 990 PRO 2TB',20500,7]],'Graphics Card':[['RTX 4060 8GB',38000,115],['RTX 4070 SUPER 12GB',85000,220],['RX 7800 XT 16GB',72000,250]],'Power Supply':[['650W 80+ Bronze',6500,0],['750W 80+ Gold',11000,0],['850W 80+ Gold',14500,0]],Case:[['Airflow Mid Tower',6500,0],['NZXT H5 Flow',10500,0],['Lian Li LANCOOL 216',14500,0]]};
const required=['CPU','Motherboard','RAM','Storage','Graphics Card','Power Supply'];const icons={CPU:'▣','CPU Cooler':'◉',Motherboard:'▦',RAM:'▥',Storage:'▰','Graphics Card':'▰','Power Supply':'⚡',Case:'▤'};let build={};
function render(){const hide=document.getElementById('hide').checked;document.getElementById('parts').innerHTML=Object.keys(parts).map(t=>{if(hide&&!build[t])return '';const v=build[t];return '<div class="part"><div class="part-icon">'+icons[t]+'</div><div class="part-name">'+t+(required.includes(t)?'<span class="req">Required</span>':'')+'<span class="selected">'+(v?v[0]:'Not selected')+'</span></div><div class="part-price">'+(v?'৳'+v[1].toLocaleString():'—')+'</div><button class="choose" onclick="openOptions(\''+t+'\')">Choose</button></div>'}).join('');update()}
function openOptions(t){document.getElementById('modalTitle').textContent='Choose '+t;document.getElementById('options').innerHTML=parts[t].map((x,i)=>'<button class="option" onclick="pick(\''+t+'\','+i+')"><b>'+x[0]+'</b><strong>৳'+x[1].toLocaleString()+'</strong><small>Estimated power: '+x[2]+'W</small></button>').join('');document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function pick(t,i){build[t]=parts[t][i];closeModal();render()}
function update(){const a=Object.values(build),total=a.reduce((s,x)=>s+x[1],0),wat=a.reduce((s,x)=>s+x[2],0),missing=required.filter(x=>!build[x]);document.getElementById('total').textContent=total.toLocaleString();document.getElementById('wat').textContent=wat+'W';document.getElementById('count').textContent=a.length;document.getElementById('message').textContent=missing.length?'Missing required: '+missing.join(', '):'✓ Required components selected.'}
function addBuild(){const missing=required.filter(x=>!build[x]);if(missing.length){alert('Please select: '+missing.join(', '));return}const total=Object.values(build).reduce((s,x)=>s+x[1],0),cart=JSON.parse(localStorage.getItem('gadgets-cart')||'[]');cart.push({id:'build-'+Date.now(),name:'Custom PC Build',category:'Desktop',price:total,details:Object.values(build).map(x=>x[0]).join(' · '),qty:1});localStorage.setItem('gadgets-cart',JSON.stringify(cart));location.href='checkout.html'}
function savePC(){localStorage.setItem('gadgets-saved-pc',JSON.stringify(build));alert('PC build saved on this device.')}
document.getElementById('hide').onchange=render;render();
</script></body></html>
